name: Publish

# Publishing is driven by tags, not by pushes to main: a branch push should be
# able to land a README fix without shipping a release, and npm refuses a
# version that already exists anyway.
#
#   npm version patch && git push --follow-tags
#
# Authentication is npm trusted publishing (OIDC). There is no NPM_TOKEN secret
# to leak or rotate: GitHub Actions proves its identity, npm issues a token good
# for this run alone, and provenance attestation is generated automatically.
#
# This requires a one-time setup on npmjs.com, under the package's
# Settings > Trusted Publisher (all fields are case-sensitive):
#   Organization or user: yBookoff
#   Repository:           thebrain-mcp
#   Workflow filename:    publish.yml
#   Allowed actions:      npm stage publish
#
# The workflow stages the release rather than publishing it. A maintainer then
# approves it with 2FA, on npmjs.com under Staged Packages or with
# `npm stage approve <id>`; the id is in the run summary. The run waits for
# the approval, then for npm to serve the version, and only then registers it
# with the MCP Registry.
#
# If the run gives up before the approval, or fails after it, finish it by
# running this workflow from main with the tag. npm answers that it already
# holds the version, and the steps after it run with main's version of this
# file.
#
#   gh workflow run publish.yml --ref main -f tag=v0.1.4

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.4"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # lets npm verify this workflow through OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A tag push publishes that tag; a manual run publishes the tag it is given.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # npm 12 needs Node 22.22.2+; trusted publishing needs 22.14+.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Check that the tag matches the version in package.json
        run: |
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg — refusing to publish"
            exit 1
          fi
          echo "publishing $(node -p "require('./package.json').name")@$pkg"

      - name: Check that server.json agrees with package.json
        run: node scripts/sync-server-json.mjs --check

      # Built with the npm that ships with Node, as in CI.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Staging needs npm 11.15+. Pinned to a major: `npm@latest` once pulled
      # in npm 12 in the middle of a release without anyone noticing.
      - name: Install npm 12 for staging
        run: npm install -g npm@12

      - name: Stage on npm
        # No token: OIDC covers authentication, and provenance comes with it.
        run: |
          set -o pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version --prefer-online 2> /dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm"
            exit 0
          fi

          log="$RUNNER_TEMP/npm-stage.log"
          if npm stage publish 2>&1 | tee "$log"; then
            id="$(sed -n 's/.*staged with id \([^)]*\)).*/\1/p' "$log" | head -n 1)"
            {
              echo "### $name@$version is staged"
              echo
              echo "Approve it with 2FA on npmjs.com under **Staged Packages**, or run:"
              echo
              echo '```'
              echo "npm stage approve ${id:-<id from npm stage list $name>}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # npm refuses a version it already holds, staged, processing or
          # published, with 409 "previously staged" or 403 "cannot publish
          # over". On a rerun that means an earlier run got this far.
          if grep -qiE "previously staged|cannot publish over" "$log"; then
            echo "npm already holds $name@$version; waiting for it below"
            exit 0
          fi
          exit 1

      # The MCP Registry stores metadata only, and validates it against the
      # package on npm, so this has to wait until npm serves the version: after
      # the approval, and after npm's own processing, which takes minutes
      # ("may take a few minutes to become available"). v0.1.3 failed here with
      # a 404 one second after npm had accepted it.
      - name: Wait for the approval and for npm to serve the version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 60); do
            if [ "$(npm view "$name@$version" version --prefer-online 2> /dev/null)" = "$version" ]; then
              echo "npm serves $name@$version"
              exit 0
            fi
            echo "npm does not serve $name@$version yet ($attempt/60)"
            sleep 60
          done
          echo "npm still does not serve $name@$version after an hour."
          echo "Once it is approved, finish with: gh workflow run publish.yml --ref main -f tag=$TAG"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        # Same OIDC identity as the npm step: no secret, nothing to rotate.
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
