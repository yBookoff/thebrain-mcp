name: Publish

# Publishing is driven by tags, not by pushes to main: a branch push should be
# able to land a README fix without shipping a release, and npm refuses a
# version that already exists anyway.
#
#   npm version patch && git push --follow-tags
#
# Authentication is npm trusted publishing (OIDC). There is no NPM_TOKEN secret
# to leak or rotate: GitHub Actions proves its identity, npm issues a token good
# for this run alone, and provenance attestation is generated automatically.
#
# This requires a one-time setup on npmjs.com, under the package's
# Settings > Trusted Publisher (all fields are case-sensitive):
#   Organization or user: yBookoff
#   Repository:           thebrain-mcp
#   Workflow filename:    publish.yml
#   Allowed actions:      npm publish
#
# A run that fails after npm accepted the package can be finished by hand: run
# this workflow from main with the tag. npm is skipped when it already has the
# version, and the steps after it run with main's version of this file.
#
#   gh workflow run publish.yml --ref main -f tag=v0.1.3

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.1.3"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # lets npm verify this workflow through OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # A tag push publishes that tag; a manual run publishes the tag it is given.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Update npm to a version that speaks OIDC
        run: npm install -g npm@latest

      - name: Check that the tag matches the version in package.json
        run: |
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json $pkg — refusing to publish"
            exit 1
          fi
          echo "publishing $(node -p "require('./package.json').name")@$pkg"

      - name: Check that server.json agrees with package.json
        run: node scripts/sync-server-json.mjs --check

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish to npm
        # No token: OIDC covers authentication, and provenance comes with it.
        # Skipped when npm already has the version, so a failed run can be
        # repeated for the steps after this one.
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$name@$version" version --prefer-online 2> /dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm, skipping"
          else
            npm publish
          fi

      # The MCP Registry stores metadata only, and validates it against the
      # package that was just published — so this has to come after npm, and
      # package.json must carry the matching `mcpName`.
      #
      # npm accepts a publish before it serves it ("may take a few minutes to
      # become available"), and the registry checks what npm serves: v0.1.3
      # failed here with a 404 one second after npm had accepted it.
      - name: Wait until npm serves the version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 30); do
            if [ "$(npm view "$name@$version" version --prefer-online 2> /dev/null)" = "$version" ]; then
              echo "npm serves $name@$version"
              exit 0
            fi
            echo "npm does not serve $name@$version yet ($attempt/30)"
            sleep 20
          done
          echo "npm still does not serve $name@$version after 10 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        # Same OIDC identity as the npm step: no secret, nothing to rotate.
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
